<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Support App</title>
<style>
:root{color-scheme:light}
html,body{background:#f7f8fb}

body{margin:0}
a{color:#162f7f}a:hover{color:#0f2260}
.sa{color-scheme:light}
.sa *{box-sizing:border-box}
.sa button{font-family:inherit;cursor:pointer}
.sa input,.sa textarea{font-family:inherit}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic-sm{width:16px;height:16px}
.ic-lg{width:28px;height:28px}
.sa-hdr{background:#fff;border-bottom:1px solid #e3e6ee;padding:14px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:30}
.sa-hdr-l{display:flex;align-items:center;gap:14px;min-width:0}
.iconbtn{width:44px;height:44px;border-radius:10px;border:0;background:transparent;color:#3b3f4a;display:inline-flex;align-items:center;justify-content:center}
.iconbtn:hover{background:#eef1f8}
.logo{width:40px;height:40px;border-radius:10px;background:#162f7f;color:#fff;display:flex;align-items:center;justify-content:center}
.org{display:flex;flex-direction:column;line-height:1.2}
.org b{font-size:15px;color:#1b1b2f}.org span{font-size:12px;color:#5c5c5c}
.hdr-title{font-size:20px;color:#1b1b2f;font-weight:400;margin:0}
.hdr-app{font-size:18px;font-weight:600;color:#1b1b2f;padding-left:16px;margin-left:4px;border-left:1px solid #e3e6ee}
.sa-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.navbtn{height:36px;padding:0 14px;border-radius:10px;border:1px solid #d5daea;background:#fff;color:#162f7f;font-size:14px}
.navbtn:hover{background:#f2f5fc}
.navbtn.is-on{background:#ecf3ff;border-color:#162f7f;font-weight:600}
.avatar{width:40px;height:40px;border-radius:50%;background:#2651b1;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:15px;margin-left:6px}
.wrap{max-width:1080px;margin:0 auto;padding:36px 24px 72px}
.h1{font-size:28px;font-weight:700;color:#1b1b2f;margin:0}
.h2{font-size:24px;font-weight:700;color:#000;margin:0}
.h3{font-size:18px;font-weight:600;color:#1b1b2f;margin:0}
.muted{color:#5c5c5c;font-size:16px;margin:6px 0 0;line-height:1.45}
.small{font-size:13px}
.card{background:#fff;border-radius:20px;padding:32px}
.card-sm{background:#fff;border-radius:16px;padding:24px}
.btn{height:44px;padding:0 20px;border-radius:10px;font-size:16px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #162f7f;white-space:nowrap}
.btn-sm{height:36px;padding:0 14px;font-size:13px;font-weight:600}
.btn-pri{background:#162f7f;color:#fff}.btn-pri:hover{background:#0f2260}
.btn-sec{background:#fff;color:#162f7f}.btn-sec:hover{background:#f2f5fc}
.btn-tint{background:#ecf3ff;color:#0058b0;border-color:#0068cf}.btn-tint:hover{background:#dde9fd}
.btn-ghost{background:transparent;border-color:transparent;color:#162f7f}.btn-ghost:hover{background:#f2f5fc}
.btn-dis,.btn:disabled{background:#e4e4e4;border-color:#e4e4e4;color:#5c5c5c;cursor:not-allowed}
.btn-danger-ghost{background:transparent;border-color:transparent;color:#b42318}.btn-danger-ghost:hover{background:#fdecea}
.linkbtn{background:none;border:0;padding:0;color:#162f7f;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill-blue{background:#ecf3ff;color:#123a8c}
.pill-grey{background:#eceef3;color:#3b3f4a}
.pill-salmon{background:#ffc2ba;color:#5e1007}
.pill-amber{background:#fff1c7;color:#6b4300}
.pill-green{background:#dcf2dc;color:#0b5a0b}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#1b1b2f;color:#fff;padding:14px 20px;border-radius:12px;font-size:15px;z-index:90;display:flex;gap:10px;align-items:center;max-width:90%}
/* home */
.home-top{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.tile{background:#fff;border:1px solid #e3e6ee;border-radius:16px;padding:22px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:190px;color:#1b1b2f}
.tile:hover{border-color:#9aa8d6;box-shadow:0 4px 14px rgba(22,47,127,.08)}
.tile .ti{width:40px;height:40px;border-radius:10px;background:#eef1f8;color:#162f7f;display:flex;align-items:center;justify-content:center}
.tile b{font-size:17px}.tile span{font-size:14px;color:#555b70;line-height:1.45}
.tile .go{margin-top:auto;font-size:14px;font-weight:600;color:#162f7f;display:flex;align-items:center;gap:6px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:32px 0 16px}
.tab{height:40px;padding:0 16px;border-radius:10px;border:1px solid #233580;background:#fff;color:#233580;font-size:14px;font-weight:600}
.tab.is-on{background:#233580;color:#fff}
.placeholder{background:#fff;border-radius:16px;border:1px dashed #c9c9c9;min-height:210px;display:flex;align-items:center;justify-content:center;color:#5c5c5c;font-size:16px}
/* dashboard */
.dash-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.seg{display:inline-flex;background:#eceef3;border-radius:12px;padding:4px;gap:4px}
.seg button{height:38px;padding:0 16px;border-radius:9px;border:0;background:transparent;font-size:14px;color:#3b3f4a;display:inline-flex;gap:8px;align-items:center}
.seg button.is-on{background:#fff;color:#162f7f;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.count{font-size:12px;min-width:22px;height:20px;padding:0 6px;border-radius:999px;background:#dfe4f1;color:#162f7f;display:inline-flex;align-items:center;justify-content:center;font-weight:600}
.typetabs{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 14px;padding-bottom:16px;border-bottom:1px solid #e3e6ee}
.ttab{height:40px;min-width:150px;padding:0 16px;border-radius:10px;border:1px solid #e3e6ee;background:#f4f5f8;color:#1b1b2f;font-size:14px;display:inline-flex;gap:8px;align-items:center;justify-content:center}
.ttab.is-on{background:#fff;border:2px solid #0068cf;color:#123a8c;font-weight:600}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tb-l{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tbtn{height:36px;padding:0 12px;border-radius:8px;border:1px solid #c9cdd8;background:#fff;color:#1b1b2f;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.tbtn.is-on{border-color:#162f7f;background:#ecf3ff;color:#123a8c;font-weight:600}
.chip-danger{height:32px;padding:0 12px;border-radius:999px;border:1px solid #f0a59b;background:#fff3f1;color:#8a1c0f;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.chip-danger.is-on{background:#ffc2ba}
.list{display:flex;flex-direction:column;gap:10px}
.arow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(170px,1fr) 120px 92px;gap:16px;align-items:center;border:1px solid #e3e6ee;border-radius:12px;padding:12px 16px;background:#fff}
.arow:hover{border-color:#9aa8d6}
.arow .pill{justify-self:start}
.arow.is-expired{background:#fffafa;border-color:#f3c9c2}
.rmain{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;min-width:0}
.rname{font-size:15px;font-weight:700;color:#1b1b2f;text-decoration:underline;text-decoration-color:transparent}
.rmain:hover .rname{text-decoration-color:#162f7f}
.rsub{font-size:13px;color:#5c5c5c}
.remain{display:flex;flex-direction:column;gap:6px}
.remain span.t{font-size:13px;color:#3b3f4a}
.bar{height:8px;border-radius:999px;background:#e1e3ea;overflow:hidden;display:block}
.bar.is-expired{background:#fbe3df;outline:1px solid #c32121}
.bar .fill{display:block;height:100%;background:#0068cf;border-radius:999px}
.bar .fill.is-warn{background:#c25e00}
.req-row{grid-template-columns:minmax(0,1.6fr) minmax(150px,1fr) 120px 92px}
.empty{padding:32px;text-align:center;color:#5c5c5c;border:1px dashed #c9c9c9;border-radius:12px}
.dd-scrim{position:fixed;inset:0;z-index:40;background:transparent}
.dd{position:relative}
.dd-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid #c9cdd8;border-radius:12px;box-shadow:0 10px 30px rgba(20,30,70,.14);padding:6px;z-index:50;display:flex;flex-direction:column;max-height:280px;overflow:auto}
.dd-menu.narrow{min-width:200px;right:auto}
.dd-opt{border:0;background:#fff;text-align:left;padding:11px 12px;border-radius:8px;font-size:14px;color:#1b1b2f}
.dd-opt:hover{background:#f2f5fc}
.dd-opt.is-on{background:#ecf3ff;color:#123a8c;font-weight:600}
/* form */
.stepper{display:flex;align-items:center;background:#fff;border-radius:16px;padding:18px 24px}
.stepw{display:flex;align-items:center;flex:1;min-width:0}
.stepw.last{flex:0 0 auto}
.step{display:flex;align-items:center;gap:12px;background:none;border:0;padding:4px;border-radius:12px;min-width:0}
.step:disabled{cursor:default}
.step.is-link:hover{background:#f2f5fc}
.dot{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex:none;border:2px solid #162f7f;background:#fff;color:#162f7f}
.step.is-done .dot{background:#162f7f;color:#fff}
.step.is-cur .dot{background:#162f7f;color:#fff;box-shadow:0 0 0 5px #d3dcf3}
.slabel{font-size:15px;color:#003d6f;font-weight:400;text-align:left}
.step.is-cur .slabel{font-weight:700;color:#162f7f}
.step.is-todo .slabel{color:#5c5c5c}
.sline{flex:1;height:3px;border-radius:3px;background:#c9c9c9;margin:0 14px;min-width:16px}
.sline.is-done{background:#162f7f}
.stepinfo{margin:16px 0 20px;background:#f6f9fe;border:1px solid #162f7f;border-radius:10px;padding:13px 18px;font-size:15px;color:#1b1b2f;display:flex;gap:10px;align-items:center}
.stepinfo b{color:#162f7f}
.errbanner{display:flex;gap:12px;align-items:flex-start;background:#fdecea;border:1px solid #d13438;color:#8a1c0f;border-radius:12px;padding:14px 16px;font-size:15px;margin:20px 0 4px}
.errbanner b{display:block;margin-bottom:2px}
.fields{display:flex;flex-direction:column;gap:28px;margin-top:28px}
.field{display:flex;flex-direction:column;gap:8px}
.flabel{font-size:16px;color:rgba(0,0,0,.82)}
.req{color:#d1131a;margin-left:2px}
.fdesc{font-size:14px;color:#5e5e5e;font-style:italic;margin-top:-4px}
.input{height:46px;border:1px solid #c9c9c9;border-radius:10px;background:#fff;padding:0 44px 0 14px;font-size:15px;color:#1b1b2f;width:100%}
.input::placeholder{color:#767676}
.input:focus,.ta:focus{background:#fff}
.ta:focus,.dd-btn:focus{outline:2px solid #2651b1;outline-offset:1px;border-color:#2651b1}
.input.prefilled{background:#effaff;border-color:#d6eaf5}
.inwrap{position:relative}
.inwrap .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px}
.chipfield{min-height:52px;border:1px solid #d6eaf5;background:#effaff;border-radius:10px;padding:8px 6px 8px 10px;display:flex;align-items:center;justify-content:space-between}
.person{display:flex;align-items:center;gap:10px;font-size:15px;color:#2446b4;text-decoration:underline}
.person i{width:30px;height:30px;border-radius:50%;background:#dddddd;display:inline-block}
.half{max-width:540px}
.tgl{display:flex;align-items:center;gap:12px;font-size:14px;color:#1b1b2f}
.tgl .on{font-weight:700}
.switch{width:60px;height:32px;border-radius:999px;border:0;background:#b8b8bf;padding:3px;display:flex;align-items:center;transition:background .15s}
.switch .knob{width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.switch.is-on{background:#162f7f}
.switch.is-on .knob{transform:translateX(28px)}
.rowq{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.dd-btn{height:52px;width:100%;border:1px solid #c9c9c9;border-radius:10px;background:#fff;padding:0 8px 0 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;color:#1b1b2f;text-align:left}
.dd-btn .ph{color:#686868}
.chev{width:34px;height:34px;border-radius:50%;background:#f0f2f7;display:flex;align-items:center;justify-content:center;color:#242424;flex:none}
.field.is-error .input,.field.is-error .dd-btn,.field.is-error .ta,.field.is-error .chipfield,.field.is-error .stepper-num{border:2px solid #d13438;background:#fff8f7}
.field.is-error .flabel{color:#a4161a}
.field-err{display:flex;gap:6px;align-items:center;color:#b42318;font-size:14px;margin:0}
.ta-wrap{position:relative}
.ta{width:100%;min-height:110px;border:1px solid #c9c9c9;border-radius:10px;background:#f4f4f5;padding:12px 14px 30px;font-size:15px;line-height:1.5;color:#1b1b2f;resize:vertical;display:block}
.wc{position:absolute;right:12px;bottom:8px;font-size:12px;color:#c42b1c;background:#f4f4f5;padding:0 4px;border-radius:4px}
.wc.is-ok{color:#0b6a0b}
.acc{border:1px solid #c9c9c9;background:#f6f6f6;border-radius:10px}
.acc-btn{width:100%;background:none;border:0;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#3b3b3b}
.caret{display:inline-flex;transition:transform .15s}
.caret.is-open{transform:rotate(180deg)}
.acc-body{padding:0 18px 18px;font-size:14px;color:#2b2b2b;line-height:1.5}
.acc-body ul{margin:6px 0 12px;padding-left:20px}
.acc-h{font-weight:700;margin:4px 0}
.example{background:#fff;border:1px solid #e3e3e3;border-radius:8px;padding:12px;margin:6px 0 12px}
.choices{display:flex;gap:10px;flex-wrap:wrap}
.choice{height:46px;padding:0 18px 0 14px;border-radius:10px;border:1px solid #c9c9c9;background:#fff;color:#1b1b2f;font-size:15px;display:inline-flex;align-items:center;gap:10px}
.choice:hover{border-color:#162f7f}
.choice .rdot{width:18px;height:18px;border-radius:50%;border:2px solid #767676;flex:none}
.choice.is-on{border:2px solid #162f7f;background:#ecf3ff;color:#123a8c;font-weight:600}
.choice.is-on .rdot{border:5px solid #162f7f}
.field.is-error .choice{border-color:#d13438;background:#fff8f7}
.stepper-num{display:flex;align-items:center;gap:6px;border:1px solid #c9c9c9;border-radius:10px;padding:4px;height:52px;background:#fff}
.stepper-num button{width:40px;height:40px;border-radius:50%;border:1px solid #9a98a0;background:#fff;color:#3b3f4a;font-size:18px;display:flex;align-items:center;justify-content:center}
.stepper-num span{min-width:40px;text-align:center;font-size:18px;color:#1b1b2f}
.freq .dd{width:240px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px;flex-wrap:wrap}
.foot-r{display:flex;gap:12px;flex-wrap:wrap}
/* approvals */
.ap-tools{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px}
.search{display:flex;align-items:center;gap:8px;height:44px;border:1px solid #b3b3b3;border-radius:999px;padding:0 6px 0 14px;width:360px;max-width:100%;background:#fff;color:#3b3f4a}
.search input{border:0;outline:0;font-size:14px;flex:1;min-width:0;background:transparent;height:40px}
.search:focus-within{outline:2px solid #2651b1}
.meter{height:9px;background:#eeeeee;border-radius:10px;margin:12px 0 24px;overflow:hidden}
.meter span{display:block;height:100%;background:#162f7f;border-radius:10px;transition:width .2s}
.ap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.apcard{border-radius:20px;border:1px solid #ffc2ba;background:#fff;padding:20px;display:flex;flex-direction:column;gap:12px}
.apcard.is-done{background:#f6f6f6;border-color:#c9c9c9}
.apcard.is-ready{border-color:#9cc59c;background:#fbfefb}
.apcard.is-error{border:2px solid #d13438;background:#fff8f7}
.ap-meta{font-size:13px;color:#5c5c5c;min-height:18px}
.ap-meta.is-red{color:#c42b1c;font-weight:600}
.ap-meta.is-green{color:#0b6a0b;font-weight:600}
.ap-img{height:170px;border:1px solid #c9c9c9;border-radius:10px;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#5c5c5c;text-align:center;padding:0}
.ap-img img{width:100%;height:100%;object-fit:cover;object-position:top left;display:block}
.ap-img .q{font-size:64px;color:#969696;line-height:1}
.ap-img .doc{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;padding:12px;word-break:break-all;color:#1b1b2f}
.ap-img .ex{display:flex;flex-direction:column;gap:6px;align-items:center;font-size:13px;padding:14px;color:#3b3f4a}
.ap-title{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ap-title h3{font-size:16px;font-weight:600;margin:0;color:#000}
.apcard.is-done .ap-title h3{color:#5c5c5c}
.tipbtn{position:relative;width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:#1e1e1e;display:inline-flex;align-items:center;justify-content:center}
.tipbtn:hover,.tipbtn:focus{background:#eef1f8}
.tipbtn .tip{display:none;position:absolute;bottom:calc(100% + 8px);right:-8px;width:230px;background:#1b1b2f;color:#fff;font-size:13px;line-height:1.4;padding:10px 12px;border-radius:8px;text-align:left;z-index:20;font-weight:400}
.tipbtn:hover .tip,.tipbtn:focus .tip{display:block}
.ap-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:auto}
/* review */
.rv-top{background:#ecf3ff;border-radius:20px;padding:24px}
.jumps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:16px}
.jump{background:#fff;border:1px solid #c9c9c9;border-radius:16px;padding:18px;display:flex;gap:12px;align-items:center;text-align:left}
.jump:hover{border-color:#162f7f}
.jump .dot{background:#162f7f;color:#fff}
.jump small{display:block;font-size:14px;font-weight:600;color:#1b1b2f}
.jump strong{display:block;font-size:19px;color:#000}
.yr-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:28px 0 8px}
.mini{display:flex;align-items:center}
.mdot{width:40px;height:40px;border-radius:50%;border:1px solid #162f7f;background:#fff;color:#000;font-weight:600;font-size:15px}
.mdot.is-on{background:#162f7f;color:#fff}
.mline{width:48px;height:2px;background:#c9c9c9}
.sec-title{font-size:18px;font-weight:700;margin:18px 0 10px;color:#162f7f}
.kv{margin:0;border-top:1px solid #e3e6ee}
.kv-row{display:grid;grid-template-columns:280px minmax(0,1fr);gap:20px;padding:14px 0;border-bottom:1px solid #e3e6ee}
.kv-row dt{color:#5c5c5c;font-size:15px}
.kv-row dd{margin:0;color:#1b1b2f;font-size:15px;white-space:pre-wrap;line-height:1.5}
.rv-nav{display:flex;justify-content:space-between;margin-top:16px}
/* success */
.succ{background:#fff;border-radius:16px;min-height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:48px 24px;gap:14px}
.succ .circle{width:84px;height:84px;border-radius:50%;border:5px solid #162f7f;color:#162f7f;display:flex;align-items:center;justify-content:center}
.succ p{max-width:520px;color:#5c5c5c;font-size:16px;line-height:1.5;margin:0}
.succ .btns{display:flex;gap:16px;margin-top:18px;flex-wrap:wrap;justify-content:center}
/* view */
.okbanner{display:flex;gap:14px;align-items:flex-start;background:#eef7ee;border:1px solid #9cc59c;border-radius:16px;padding:18px 20px;margin-bottom:24px}
.okbanner .okic{width:28px;height:28px;border-radius:50%;background:#107c10;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.okbanner b{font-size:17px;color:#1b1b2f}
.okbanner p{margin:4px 0 0;font-size:15px;color:#3b3f4a}
.vgrid{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.vmain{flex:999 1 560px;min-width:0}
.vside{flex:1 1 300px;display:flex;flex-direction:column;gap:20px;min-width:0}
.vhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.vbtns{display:flex;gap:8px;flex-wrap:wrap}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:36px}
.drow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eef0f4;font-size:15px}
.drow dt{color:#5c5c5c}
.drow dd{margin:0;color:#1b1b2f;text-align:right}
.just h4{font-size:15px;color:#5c5c5c;font-weight:400;margin:20px 0 6px}
.just p{margin:0;font-size:15px;line-height:1.55;color:#1b1b2f;white-space:pre-wrap}
.denied{margin-top:18px;background:#fdecea;border:1px solid #f0a59b;border-radius:12px;padding:14px 16px;font-size:15px;color:#5e1007}
.vactions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.tl{display:flex;flex-direction:column;margin-top:14px}
.tl-i{display:grid;grid-template-columns:22px 1fr;gap:12px;position:relative;padding-bottom:18px}
.tl-i:last-child{padding-bottom:0}
.tl-i::before{content:"";position:absolute;left:10px;top:24px;bottom:2px;width:2px;background:#d7dbe6}
.tl-i:last-child::before{display:none}
.tl-dot{width:22px;height:22px;border-radius:50%;border:2px solid #b5bccd;background:#fff;display:flex;align-items:center;justify-content:center;color:#fff}
.tl-i.is-done .tl-dot{background:#107c10;border-color:#107c10}
.tl-i.is-cur .tl-dot{border-color:#162f7f;box-shadow:inset 0 0 0 4px #fff;background:#162f7f}
.tl-i.is-bad .tl-dot{background:#c42b1c;border-color:#c42b1c}
.tl-i b{font-size:15px;color:#1b1b2f;display:block}
.tl-i span{font-size:13px;color:#5c5c5c}
.mya{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.mya-r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:#fff;text-align:left;font-size:14px;color:#1b1b2f;width:100%}
.mya-r:hover{background:#f2f5fc}
.mya-r.is-warn{background:#fff6e5}
.mya-r span{color:#5c5c5c;font-size:13px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(15,20,40,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:#fff;border-radius:20px;width:560px;max-width:100%;max-height:92vh;overflow:auto;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.modal-f{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.dz{margin-top:6px;border:2px dashed #9aa8d6;background:#f6f9fe;border-radius:14px;min-height:150px;padding:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;color:#3b3f4a;font-size:14px;cursor:pointer}
.dz:hover{background:#eef3fd}
.dz b{color:#162f7f;font-size:15px}
.field.is-error .dz{border-color:#d13438;background:#fff8f7}
.file{margin-top:6px;display:flex;gap:12px;align-items:center;border:1px solid #c9c9c9;border-radius:12px;padding:10px}
.file img{width:72px;height:56px;object-fit:cover;object-position:top left;border-radius:6px;border:1px solid #e3e3e3}
.file .fi{width:72px;height:56px;border-radius:6px;background:#eef1f8;color:#162f7f;display:flex;align-items:center;justify-content:center}
.file .fn{flex:1;min-width:0;font-size:14px;word-break:break-all}
.file .fn span{display:block;color:#0b6a0b;font-size:13px;margin-top:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){
.sa-hdr{padding:12px 16px}.wrap{padding:24px 16px 56px}.card{padding:20px}
.arow,.req-row{grid-template-columns:1fr}.dgrid{grid-template-columns:1fr}.kv-row{grid-template-columns:1fr;gap:4px}
.slabel{display:none}.stepper{padding:14px}
}

</style>
</head>
<body>
<div id="root"></div>
<template id="tpl">
<div class="sa" id="sa-top" style="min-height: 900px; background: #f7f8fb; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif; color: #1b1b2f">

<header class="sa-hdr">
  <div class="sa-hdr-l">
    <sc-if value="{{hdr.showLogo}}" hint-placeholder-val="{{true}}">
      <div class="logo" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="M4 18V8l8-4 8 4v10"></path><path d="M9 18v-5h6v5"></path></svg></div>
      <div class="org"><b>MCAPS-Core</b><span>Data &amp; Applied AI</span></div>
      <span class="hdr-app">Support App</span>
    </sc-if>
    <sc-if value="{{hdr.showBack}}" hint-placeholder-val="{{false}}">
      <button class="iconbtn" onClick="{{hdr.back}}" aria-label="Go back"><svg class="ic" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <h1 class="hdr-title">{{hdr.title}}</h1>
    </sc-if>
  </div>
  <nav class="sa-nav" aria-label="Main">
    <button class="navbtn" onClick="{{oos}}">Admin Board</button>
    <button class="navbtn" onClick="{{oos}}">New Capability Requests</button>
    <button class="{{hdr.dashCls}}" onClick="{{goDashboard}}">Request Dashboard</button>
    <span class="avatar" aria-label="Signed in as Pat Pabedes">PP</span>
  </nav>
</header>


<sc-if value="{{scr.home}}" hint-placeholder-val="{{true}}">
<main class="wrap">
  <div class="home-top">
    <h2 class="h1">What do you need?</h2>
    <button class="linkbtn" onClick="{{oos}}">Not sure which to choose? Contact PM</button>
  </div>
  <div class="tiles">
    <button class="tile" onClick="{{oos}}">
      <span class="ti"><svg class="ic" viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"></path><path d="M10 13h6M13 10v6"></path></svg></span>
      <b>New Capability Request</b><span>Submit business requirements for a new report, dashboard, dataset or solution.</span>
    </button>
    <button class="tile" onClick="{{oos}}">
      <span class="ti"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v8M8 12h8"></path></svg></span>
      <b>Enhancement Request</b><span>Request improvements or new features for existing reports and datasets.</span>
    </button>
    <button class="tile" onClick="{{oos}}">
      <span class="ti"><svg class="ic" viewBox="0 0 24 24"><path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path></svg></span>
      <b>Report Issue</b><span>Report data issues, errors or incorrect results in existing reports.</span>
    </button>
    <button class="tile is-feature" onClick="{{goAccess}}">
      <span class="ti"><svg class="ic" viewBox="0 0 24 24"><circle cx="8" cy="12" r="4"></circle><path d="M12 12h9M18 12v3M21 12v2"></path></svg></span>
      <b>Access Request</b><span>Request access to reports, dashboards, data sources, applications and other supported resources.</span>
      <span class="go">Start a request <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></span>
    </button>
  </div>

  <div class="tabs" role="tablist" aria-label="Dashboards">
    <button class="{{home.tabIssue}}" role="tab" aria-selected="{{home.isIssue}}" onClick="{{home.pickIssue}}">Issue/Enhancement Dashboard</button>
    <button class="{{home.tabCap}}" role="tab" aria-selected="{{home.isCap}}" onClick="{{home.pickCap}}">New Capability Dashboard</button>
    <button class="{{home.tabAccess}}" role="tab" aria-selected="{{home.isAccess}}" onClick="{{home.pickAccess}}">Request Access Dashboard</button>
  </div>

  <sc-if value="{{home.showTable}}" hint-placeholder-val="{{true}}">
    <div class="placeholder">Existing request table (unchanged)</div>
  </sc-if>

  <sc-if value="{{home.isAccess}}" hint-placeholder-val="{{false}}">
  <section class="card" aria-label="Request Access Dashboard">
    <div class="dash-head">
      <div>
        <h2 class="h2">Request Access Dashboard</h2>
        <p class="muted">See what you can access, when it expires, and where your requests stand.</p>
      </div>
      <div class="seg" role="tablist" aria-label="View">
        <button class="{{d.segAccessCls}}" role="tab" aria-selected="{{d.modeAccess}}" onClick="{{d.toAccess}}">My access <span class="count">{{d.accessTotal}}</span></button>
        <button class="{{d.segReqCls}}" role="tab" aria-selected="{{d.modeReq}}" onClick="{{d.toReq}}">My requests <span class="count">{{d.reqTotal}}</span></button>
      </div>
    </div>

    <div class="typetabs" role="tablist" aria-label="Access type">
      <sc-for list="{{d.types}}" as="t" hint-placeholder-count="3">
        <button class="{{t.cls}}" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}">{{t.label}} <span class="count">{{t.count}}</span></button>
      </sc-for>
    </div>

    <div class="toolbar">
      <div class="tb-l">
        <div class="dd">
          <button class="{{d.filterCls}}" onClick="{{d.dd.toggle}}" aria-haspopup="listbox" aria-expanded="{{d.dd.open}}">
            <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filter: {{d.filterLabel}}
            <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg>
          </button>
          <sc-if value="{{d.dd.open}}" hint-placeholder-val="{{false}}">
            <div class="dd-menu narrow" role="listbox">
              <sc-for list="{{d.dd.opts}}" as="o" hint-placeholder-count="4">
                <button class="{{o.cls}}" role="option" aria-selected="{{o.on}}" onClick="{{o.pick}}">{{o.label}}</button>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <button class="{{d.dateCls}}" onClick="{{d.sortDate}}" aria-label="Sort by date">
          {{d.dateLabel}}
          <sc-if value="{{d.dirAsc}}" hint-placeholder-val="{{true}}"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></sc-if>
          <sc-if value="{{d.dirDesc}}" hint-placeholder-val="{{false}}"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"></path></svg></sc-if>
        </button>
        <button class="{{d.azCls}}" onClick="{{d.sortAz}}">A–Z</button>
        <sc-if value="{{d.hasFilter}}" hint-placeholder-val="{{false}}">
          <button class="linkbtn" onClick="{{d.clearFilter}}">Clear</button>
        </sc-if>
      </div>
      <sc-if value="{{d.showExpired}}" hint-placeholder-val="{{true}}">
        <button class="{{d.expiredCls}}" onClick="{{d.filterExpired}}"><svg class="ic ic-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{d.expiredText}}</button>
      </sc-if>
    </div>

    <div class="list">
      <sc-if value="{{d.modeAccess}}" hint-placeholder-val="{{true}}">
        <sc-for list="{{d.rows}}" as="r" hint-placeholder-count="3">
          <div class="{{r.rowCls}}">
            <button class="rmain" onClick="{{r.open}}">
              <span class="rname">{{r.name}}</span>
              <span class="rsub">{{r.sub}}</span>
            </button>
            <div class="remain">
              <span class="t">{{r.remainText}}</span>
              <span class="{{r.barCls}}"><span class="{{r.fillCls}}" style="width: {{r.pct}}%"></span></span>
            </div>
            <span class="{{r.pillCls}}">{{r.statusLabel}}</span>
            <button class="btn btn-sec btn-sm" onClick="{{r.renew}}" disabled="{{r.renewDisabled}}" aria-label="{{r.renewAria}}">Renew</button>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{d.modeReq}}" hint-placeholder-val="{{false}}">
        <sc-for list="{{d.rows}}" as="r" hint-placeholder-count="3">
          <div class="arow req-row">
            <button class="rmain" onClick="{{r.open}}">
              <span class="rname">{{r.name}}</span>
              <span class="rsub">{{r.sub}}</span>
            </button>
            <span class="rsub">{{r.when}}</span>
            <span class="{{r.pillCls}}">{{r.statusLabel}}</span>
            <button class="{{r.linkCls}}" onClick="{{r.open}}">{{r.linkText}}</button>
          </div>
        </sc-for>
      </sc-if>
      <sc-if value="{{d.isEmpty}}" hint-placeholder-val="{{false}}">
        <div class="empty">Nothing matches this filter. <button class="linkbtn" onClick="{{d.clearFilter}}">Clear filter</button></div>
      </sc-if>
    </div>
  </section>
  </sc-if>
</main>
</sc-if>


<sc-if value="{{scr.access}}" hint-placeholder-val="{{false}}">
<main class="wrap" style="max-width: 860px">
  <section class="card" style="text-align: center">
    <h2 class="h2">What do you need access to?</h2>
    <p class="muted" style="max-width: 520px; margin-left: auto; margin-right: auto">Each type has its own short form and approval path. Pick one; you can submit another request afterwards.</p>
    <div style="display: flex; flex-direction: column; gap: 16px; margin-top: 28px; text-align: left">
      <button class="tile" style="min-height: 0; flex-direction: row; align-items: center; gap: 18px" onClick="{{oos}}">
        <span class="ti"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><b>Report access (CESBI Hub)</b><span>View a Power BI report or dashboard someone has already built</span></span>
        <svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button class="tile" style="min-height: 0; flex-direction: row; align-items: center; gap: 18px" onClick="{{oos}}">
        <span class="ti"><svg class="ic" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="8" ry="3"></ellipse><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><b>Data access (Datamart / Tabular)</b><span>Query the underlying data yourself</span></span>
        <svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
      <button class="tile is-feature" style="min-height: 0; flex-direction: row; align-items: center; gap: 18px" onClick="{{startForm}}">
        <span class="ti"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4M7 10h4"></path></svg></span>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 4px"><b>MI / SPN access</b><span>Let a pipeline or app read data with a managed identity or service principal</span></span>
        <svg class="ic" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
    <div style="margin-top: 22px; background: #ecf3ff; border-radius: 10px; padding: 16px 20px; display: flex; gap: 12px; text-align: left; font-size: 14px; line-height: 1.5; color: #1b1b2f">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.5"></path></svg>
      <span><b>Not sure?</b> If you want to look at numbers in a dashboard, choose Report access. If you need to write your own queries, choose Data access. If a script or app needs the data, choose MI/SPN.</span>
    </div>
  </section>
</main>
</sc-if>


<sc-if value="{{scr.form}}" hint-placeholder-val="{{false}}">
<main class="wrap">
  <nav class="stepper" aria-label="Form progress">
    <sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
      <div class="{{s.wrapCls}}">
        <button class="{{s.cls}}" onClick="{{s.go}}" disabled="{{s.disabled}}" aria-current="{{s.aria}}">
          <span class="dot">
            <sc-if value="{{s.done}}" hint-placeholder-val="{{false}}"><svg class="ic" viewBox="0 0 24 24" style="stroke-width: 3"><path d="M5 12l5 5 9-10"></path></svg></sc-if>
            <sc-if value="{{s.showNum}}" hint-placeholder-val="{{true}}">{{s.n}}</sc-if>
          </span>
          <span class="slabel">{{s.label}}</span>
        </button>
        <sc-if value="{{s.hasLine}}" hint-placeholder-val="{{true}}"><span class="{{s.lineCls}}"></span></sc-if>
      </div>
    </sc-for>
  </nav>
  <div class="stepinfo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.5"></path></svg><span><b>Step {{form.stepNum}} of 4 · {{form.stepLabel}}</b> — {{form.guide}}</span></div>

  
  <sc-if value="{{form.s0}}" hint-placeholder-val="{{true}}">
  <section class="card">
    <h2 class="h2">Approval Check</h2>
    <p class="muted">Each approval needs proof and an expiry date. Approvals already on file are reused automatically.</p>
    <sc-if value="{{ap.showErr}}" hint-placeholder-val="{{false}}">
      <div class="errbanner" role="alert"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16v.5"></path></svg><span><b>{{ap.errTitle}}</b>Upload an approval or mark yourself exempt on each highlighted card.</span></div>
    </sc-if>
    <div class="ap-tools">
      <label class="search"><svg class="ic ic-sm" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><span class="vh">Search approvals</span><input type="text" placeholder="Search approvals" value="{{ap.search}}" onChange="{{ap.onSearch}}"></input>
        <sc-if value="{{ap.hasSearch}}" hint-placeholder-val="{{false}}"><button class="iconbtn" style="width: 32px; height: 32px" onClick="{{ap.clearSearch}}" aria-label="Clear search"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></sc-if>
      </label>
      <span class="{{ap.needCls}}">{{ap.needText}}</span>
    </div>
    <div class="meter" role="progressbar" aria-label="Approvals complete" aria-valuenow="{{ap.pct}}" aria-valuemin="0" aria-valuemax="100"><span style="width: {{ap.pct}}%"></span></div>
    <div class="ap-grid">
      <sc-for list="{{ap.cards}}" as="a" hint-placeholder-count="4">
        <article class="{{a.cls}}">
          <span class="{{a.metaCls}}">{{a.meta}}</span>

  <sc-if value="{{form.s1}}" hint-placeholder-val="{{false}}">
  <section class="card">
    <h2 class="h2">Detail</h2>
    <p class="muted">Tell us who owns this identity and where it lives. Fields marked <span class="req">*</span> are required.</p>
    <sc-if value="{{form.showErrBanner}}" hint-placeholder-val="{{false}}">
      <div class="errbanner" role="alert"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v6M12 16v.5"></path></svg><span><b>{{form.errTitle}}</b>Fill in the highlighted fields to continue.</span></div>
    </sc-if>
    <div class="fields">
      <div class="rowq">
        <span class="flabel" id="lbl-mala">Is Mala Org?<span class="req">*</span></span>
        <div class="tgl"><span class="{{tg.malaNo}}">No</span><button class="{{tg.mala}}" role="switch" aria-checked="{{f.mala}}" aria-labelledby="lbl-mala" onClick="{{h.toggleMala}}"><span class="knob"></span></button><span class="{{tg.malaYes}}">Yes</span></div>
      </div>

      <div class="{{c.user}}">
        <label class="flabel" for="f-user">User<span class="req">*</span></label>
        <sc-if value="{{f.userLocked}}" hint-placeholder-val="{{true}}">
          <div class="chipfield"><span class="person"><i aria-hidden="true"></i>{{f.user}}</span><button class="iconbtn" onClick="{{h.clearUser}}" aria-label="Remove user"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
        </sc-if>
        <sc-if value="{{f.userOpen}}" hint-placeholder-val="{{false}}">
          <input id="f-user" class="input" placeholder="Search by name or alias" value="{{f.user}}" onChange="{{h.user}}" aria-invalid="{{has.user}}"></input>
        </sc-if>
        <sc-if value="{{has.user}}" hint-placeholder-val="{{false}}"><p class="field-err">{{e.user}}</p></sc-if>
      </div>

      <div class="{{c.manager}}">
        <label class="flabel" for="f-mgr">FTE Manager Alias<span class="req">*</span></label>
        <span class="fdesc">Your direct manager. They'll be asked to approve this request.</span>
        <div class="inwrap"><input id="f-mgr" class="{{ic.manager}}" placeholder="Alias" value="{{f.manager}}" onChange="{{h.manager}}" aria-invalid="{{has.manager}}"></input>
          <sc-if value="{{f.hasManager}}" hint-placeholder-val="{{true}}"><button class="iconbtn clr" onClick="{{h.clearManager}}" aria-label="Clear manager alias"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></sc-if></div>
        <sc-if value="{{has.manager}}" hint-placeholder-val="{{false}}"><p class="field-err">{{e.manager}}</p></sc-if>
      </div>

      <div class="{{c.owner}}">
        <label class="flabel" for="f-owner">Downstream System FTE Owner<span class="req">*</span></label>
        <div class="inwrap"><input id="f-owner" class="input" placeholder="Alias" value="{{f.owner}}" onChange="{{h.owner}}" aria-invalid="{{has.owner}}"></input>
          <sc-if value="{{f.hasOwner}}" hint-placeholder-val="{{false}}"><button class="iconbtn clr" onClick="{{h.clearOwner}}" aria-label="Clear owner alias"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></sc-if></div>
        <sc-if value="{{has.owner}}" hint-placeholder-val="{{false}}"><p class="field-err">{{e.owner}}</p></sc-if>
      </div>

      <div class="{{c.identity}}">
        <label class="flabel" for="f-id">Managed identity / service principal name<span class="req">*</span></label>
        <input id="f-id" class="input" placeholder="e.g. mi-forecast-svc" value="{{f.identity}}" onChange="{{h.identity}}" aria-invalid="{{has.identity}}"></input>
        <sc-if value="{{has.identity}}" hint-placeholder-val="{{false}}"><p class="field-err">{{e.identity}}</p></sc-if>
      </div>

<main class="wrap">
  <sc-if value="{{v.banner}}" hint-placeholder-val="{{false}}">
    <div class="okbanner" role="status">
      <span class="okic"><svg class="ic ic-sm" viewBox="0 0 24 24" style="stroke-width: 3"><path d="M5 12l5 5 9-10"></path></svg></span>
      <div style="flex: 1"><b>Request #{{v.id}} submitted</b><p>Your manager has been emailed. You'll be notified here and by email at each step. Nothing else to do right now.</p></div>

          <div class="drow"><dt>{{v.k3}}</dt><dd>{{v.v3}}</dd></div>
          <div class="drow"><dt>{{v.k7}}</dt><dd>{{v.v7}}</dd></div>
        </dl>
        <dl style="margin: 0">
          <div class="drow"><dt>Requester</dt><dd>pabedesf</dd></div>

          <button class="btn btn-sec btn-sm" onClick="{{v.nudge}}"><svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10 21h4"></path></svg>Nudge approver</button>

        <sc-if value="{{v.canRenew}}" hint-placeholder-val="{{false}}"><button class="btn btn-pri btn-sm" onClick="{{v.renew}}">Renew access</button></sc-if>
        <button class="btn btn-sec btn-sm" onClick="{{goAccess}}">Request other access</button>
      </div>
    </section>
    <div class="vside">

          </sc-for>

      </section>
    </div>
  </div>
</main>
</sc-if>

  validateAnd(fn) {
    const s = this.state.step;
    const errs = this.stepErrors(s);
    if (Object.keys(errs).length) {
      this.setState({ showErr: Object.assign({}, this.state.showErr, { [s]: true }), openDD: '' }, () => this.scrollToError());
      return;
    }
    fn();
  }
  next() {
    const s = this.state.step;
    if (s === 3) {
      const bad = [0, 1, 2].filter(i => Object.keys(this.stepErrors(i)).length);
      if (bad.length) { this.setState({ step: bad[0], showErr: Object.assign({}, this.state.showErr, { [bad[0]]: true }) }, () => this.scrollToError()); return; }
      const sub = this.makeSubmission(this.state);
      this.go('success', sub);
      return;
    }
    this.validateAnd(() => { this.setState({ step: s + 1, maxStep: Math.max(this.state.maxStep, s + 1), openDD: '' }); this.top(); });
  }
  back() {
    if (this.state.step === 0) { this.go('access'); return; }
    this.setState({ step: this.state.step - 1, openDD: '' }); this.top();
  }
  goStep(i) {
    if (i > this.state.maxStep || i === this.state.step) return;
    this.setState({ step: i, openDD: '' }); this.top();
  }
  startForm(renewName) {
    const f = seedForm(0);
    if (renewName) f.identity = renewName;
    this.go('form', { step: 0, maxStep: 0, form: f, approvals: seedApprovals(false), showErr: { 0: false, 1: false, 2: false }, reviewSec: 0, apSearch: '', renewing: renewName || '' });
    if (renewName) this.flash('Renewing ' + renewName + ' — what we know is already filled in.');
  }

  ddVals(key, opts, val, ph) {
    const open = this.state.openDD === key;
    return {
      open: open,
      toggle: () => this.setState({ openDD: open ? '' : key }),
      text: val || ph, valCls: val ? '' : 'ph',
      opts: opts.map(o => ({ label: o, on: o === val, cls: 'dd-opt' + (o === val ? ' is-on' : ''), pick: () => { this.setState({ form: Object.assign({}, this.state.form, { [key]: o }), openDD: '' }); } }))
    };
  }

  accessStatus(a) { const d = daysUntil(a.expires); return d <= 0 ? 'expired' : d <= 30 ? 'expiring' : 'active'; }

  openView(kind, id) { this.go('view', { view: { kind: kind, id: id }, banner: false }); }
  renew(a) {
    if (a.type !== 'mispn') { this.flash("Renewal for this access type isn't available yet. Contact your PM for help."); return; }
    this.startForm(a.name);
  }

  dashVals() {
    const s = this.state;
    const isAcc = s.dashMode === 'access';
    const all = isAcc ? s.access : s.requests;
    const ofType = all.filter(x => x.type === s.dashType);
    const filters = isAcc ? [['all', 'All statuses'], ['active', 'Active'], ['expiring', 'Expiring soon'], ['expired', 'Expired']] : [['all', 'All statuses'], ['pending', 'Pending'], ['approved', 'Approved'], ['denied', 'Denied']];
    let rows = ofType.filter(x => s.dashFilter === 'all' || (isAcc ? this.accessStatus(x) === s.dashFilter : x.status === s.dashFilter));
    const dateOf = x => isAcc ? x.expires : x.submitted;
    rows = rows.slice().sort((a, b) => {
      if (s.sortKey === 'az') return a.name.localeCompare(b.name);
      const c = dateOf(a) < dateOf(b) ? -1 : dateOf(a) > dateOf(b) ? 1 : 0;
      return s.sortDir === 'asc' ? c : -c;
    });
    const expiredCount = isAcc ? ofType.filter(x => this.accessStatus(x) === 'expired').length : 0;
    const ddOpen = s.openDD === 'dashFilter';
    const fLabel = (filters.find(f => f[0] === s.dashFilter) || filters[0])[1];
    const PILL = { active: ['pill pill-blue', 'Active'], expiring: ['pill pill-amber', 'Expiring soon'], expired: ['pill pill-salmon', 'Expired'], pending: ['pill pill-grey', 'Pending'], approved: ['pill pill-blue', 'Approved'], denied: ['pill pill-salmon', 'Denied'] };
    const outRows = rows.map(x => {
      if (isAcc) {
        const st = this.accessStatus(x), d = daysUntil(x.expires);
        return {
          name: x.name, sub: x.role + ' · granted ' + fmtMonth(x.granted),
          remainText: st === 'expired' ? 'Expired ' + fmtDate(x.expires) : d + ' days remaining · ' + fmtDate(x.expires),
          pct: st === 'expired' ? 0 : Math.max(3, Math.min(100, Math.round(d / 365 * 100))),
          barCls: 'bar' + (st === 'expired' ? ' is-expired' : ''), fillCls: 'fill' + (st === 'expiring' ? ' is-warn' : ''),
          pillCls: PILL[st][0], statusLabel: PILL[st][1],
          rowCls: 'arow' + (st === 'expired' ? ' is-expired' : ''),
          renewDisabled: true, renewAria: 'Renew ' + x.name + ' (not available yet)',
          open: () => this.openView('acc', x.id), renew: () => this.renew(x)
        };
      }
      return {
        name: x.name, sub: '#' + x.id + ' · ' + TYPE_LABEL[x.type], when: 'Submitted ' + fmtDate(x.submitted),
        pillCls: PILL[x.status][0], statusLabel: PILL[x.status][1],
        linkCls: x.status === 'denied' ? 'linkbtn' : 'linkbtn', linkText: x.status === 'denied' ? 'See detail' : 'View',
        open: () => this.openView('req', x.id)
      };
    });
    const types = ['reporting', 'datamart', 'mispn'].map(t => ({
      label: t === 'mispn' ? 'MI/SPN' : t === 'reporting' ? 'Reporting' : 'Datamart', on: s.dashType === t,
      cls: 'ttab' + (s.dashType === t ? ' is-on' : ''), count: all.filter(x => x.type === t).length,
      pick: () => this.setState({ dashType: t, dashFilter: 'all', openDD: '' })
    }));
    const setMode = mode => this.setState({ dashMode: mode, dashFilter: 'all', sortKey: 'date', sortDir: mode === 'access' ? 'asc' : 'desc', openDD: '' });
    return {
      modeAccess: isAcc, modeReq: !isAcc,
      segAccessCls: isAcc ? 'is-on' : '', segReqCls: isAcc ? '' : 'is-on',
      toAccess: () => setMode('access'), toReq: () => setMode('requests'),
      accessTotal: s.access.length, reqTotal: s.requests.length,
      types: types, rows: outRows, isEmpty: outRows.length === 0,
      filterLabel: fLabel, filterCls: 'tbtn' + (s.dashFilter !== 'all' ? ' is-on' : ''),
      hasFilter: s.dashFilter !== 'all',
      clearFilter: () => this.setState({ dashFilter: 'all' }),
      dd: { open: ddOpen, toggle: () => this.setState({ openDD: ddOpen ? '' : 'dashFilter' }),
        opts: filters.map(f => ({ label: f[1], on: f[0] === s.dashFilter, cls: 'dd-opt' + (f[0] === s.dashFilter ? ' is-on' : ''), pick: () => this.setState({ dashFilter: f[0], openDD: '' }) })) },
      dateLabel: isAcc ? 'Expiry date' : 'Submitted date',
      dateCls: 'tbtn' + (s.sortKey === 'date' ? ' is-on' : ''), azCls: 'tbtn' + (s.sortKey === 'az' ? ' is-on' : ''),
      dirAsc: s.sortDir === 'asc', dirDesc: s.sortDir !== 'asc',
      sortDate: () => this.setState({ sortKey: 'date', sortDir: s.sortKey === 'date' ? (s.sortDir === 'asc' ? 'desc' : 'asc') : s.sortDir }),
      sortAz: () => this.setState({ sortKey: 'az' }),
      showExpired: isAcc && expiredCount > 0, expiredText: expiredCount + ' expired',
      expiredCls: 'chip-danger' + (s.dashFilter === 'expired' ? ' is-on' : ''),
      filterExpired: () => this.setState({ dashFilter: s.dashFilter === 'expired' ? 'all' : 'expired' })
    };
  }

  approvalVals() {
    const s = this.state;
    const errs = this.apErrors();
    const show = s.showErr[0];
    const total = s.approvals.length;
    const need = Object.keys(errs).length;
    const q = s.apSearch.trim().toLowerCase();
    const cards = s.approvals.filter(a => !q || a.name.toLowerCase().indexOf(q) >= 0).map(a => {
      const st = a.status, err = show && errs[a.id];
      let meta = '', metaCls = 'ap-meta';
      if (st === 'none') meta = 'No previous approvals';
      if (st === 'expired') { meta = 'Expired ' + fmtShort(a.expires); metaCls += ' is-red'; }
      if (st === 'confirmed') meta = 'Expires ' + fmtShort(a.expires);
      if (st === 'uploaded') { meta = 'Uploaded · expires ' + fmtShort(a.expires); metaCls += ' is-green'; }
      if (st === 'exempt') { meta = 'Exemption requested'; metaCls += ' is-green'; }
      let cls = 'apcard';
      if (st === 'confirmed') cls += ' is-done';
      if (st === 'uploaded' || st === 'exempt') cls += ' is-ready';
      if (err) cls += ' is-error';
      return {
        name: a.name, info: a.info, tipAria: 'About ' + a.name + ': ' + a.info, meta: meta, metaCls: metaCls, cls: cls,
        alt: a.name + ' document', reason: a.reason || '', fileName: a.fileName || '', preview: a.preview || '',
        showQ: st === 'none', showStock: st === 'expired' || st === 'confirmed',
        showPreview: st === 'uploaded' && !!a.isImage, showDoc: st === 'uploaded' && !a.isImage, showExempt: st === 'exempt',
        showErr: !!err, err: err || '',
        showExemptBtn: st === 'none' || st === 'expired', showPrimary: st === 'none' || st === 'expired',
        primaryLabel: st === 'expired' ? 'Renew' : 'Get Approved',
        showConfirmed: st === 'confirmed', showUndo: st === 'uploaded' || st === 'exempt', showReplace: st === 'uploaded',
        upload: () => this.setState({ modal: { kind: 'upload', apId: a.id, renew: st === 'expired', fileName: '', preview: '', isImage: false, expires: '', tried: false, fileErrText: '' } }),
        exempt: () => this.setState({ modal: { kind: 'exempt', apId: a.id, reason: '', tried: false } }),
        undo: () => this.setAp(a.id, { status: a.prev || 'none', fileName: '', preview: '', isImage: false, reason: '', expires: a.prevExpires || a.expires })
      };
    });
    return {
      cards: cards, noMatch: cards.length === 0, search: s.apSearch, hasSearch: !!s.apSearch,
      onSearch: e => this.setState({ apSearch: e.target.value }), clearSearch: () => this.setState({ apSearch: '' }),
      needText: need === 0 ? 'All approvals ready' : need + ' more approval' + (need === 1 ? '' : 's') + ' needed',
      needCls: need === 0 ? 'pill pill-green' : 'pill pill-salmon',
      pct: Math.round((total - need) / total * 100),
      showErr: show && need > 0, errTitle: need + ' approval' + (need === 1 ? ' still needs' : 's still need') + ' attention. '
    };
  }

  modalVals() {
    const m = this.state.modal;
    const base = { isUpload: false, isExempt: false, isApprover: false, isHistory: false, close: () => this.setState({ modal: null }) };
    if (!m) return base;
    const ap = m.apId ? this.state.approvals.find(a => a.id === m.apId) : null;
    if (m.kind === 'upload') {
      const fileMissing = !m.fileName;
      const dateMsg = !m.expires ? 'Enter the date this approval expires.' : (m.expires <= TODAY_ISO ? 'Enter a date after today.' : '');
      const fileErr = (m.tried && fileMissing) || !!m.fileErrText;
      const take = file => {
        if (!file) return;
        if (!/\.(png|jpe?g|pdf)$/i.test(file.name)) { this.setModal({ fileErrText: 'Upload a PNG, JPG or PDF file.' }); return; }
        if (file.size > 10 * 1024 * 1024) { this.setModal({ fileErrText: 'That file is over 10 MB. Upload a smaller file.' }); return; }
        const isImage = /\.(png|jpe?g)$/i.test(file.name);
        this.setModal({ fileName: file.name, isImage: isImage, preview: '', fileErrText: '' });
        if (isImage && window.FileReader) { const r = new FileReader(); r.onload = () => this.setModal({ preview: r.result }); r.readAsDataURL(file); }
      };
      return Object.assign(base, {
        isUpload: true, title: (m.renew ? 'Renew ' : 'Upload ') + (ap ? ap.name : 'approval'),
        noFile: fileMissing, hasFile: !fileMissing, fileName: m.fileName, preview: m.preview,
        isImage: !!m.isImage && !!m.preview, isDoc: !(m.isImage && m.preview),
        fileCls: 'field' + (fileErr ? ' is-error' : ''), fileErr: fileErr, fileErrText: m.fileErrText || 'Upload the approval document.',
        dateCls: 'field' + (m.tried && dateMsg ? ' is-error' : ''), dateErr: !!(m.tried && dateMsg), dateErrText: dateMsg,
        minDate: '2026-11-17', expires: m.expires,
        onFile: e => { take(e.target.files && e.target.files[0]); try { e.target.value = ''; } catch (x) {} },
        dragOver: e => e.preventDefault(),
        drop: e => { e.preventDefault(); take(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]); },
        clearFile: () => this.setModal({ fileName: '', preview: '', isImage: false }),
        onDate: e => this.setModal({ expires: e.target.value }),
        save: () => {
          if (fileMissing || dateMsg) { this.setModal({ tried: true }); setTimeout(() => { const el = document.querySelector('.modal .field.is-error input, .modal .field.is-error label'); if (el && el.focus) el.focus(); }, 30); return; }
          this.setAp(m.apId, { status: 'uploaded', prev: ap.status === 'uploaded' ? ap.prev : ap.status, prevExpires: ap.status === 'uploaded' ? ap.prevExpires : ap.expires, fileName: m.fileName, preview: m.preview, isImage: !!m.isImage && !!m.preview, expires: m.expires });
          this.setState({ modal: null });
          this.flash(ap.name + ' added · expires ' + fmtDate(m.expires));
        }
      });
    }
    if (m.kind === 'exempt') {
      const bad = m.tried && !m.reason.trim();
      return Object.assign(base, {
        isExempt: true, title: 'Mark ' + (ap ? ap.name : '') + ' as exempt', reason: m.reason,
        reasonCls: 'field' + (bad ? ' is-error' : ''), reasonErr: bad,
        onReason: e => this.setModal({ reason: e.target.value }),
        saveExempt: () => {
          if (!m.reason.trim()) { this.setModal({ tried: true }); return; }
          this.setAp(m.apId, { status: 'exempt', prev: ap.status, prevExpires: ap.expires, reason: m.reason.trim() });
          this.setState({ modal: null });
          this.flash(ap.name + ' marked as exempt');
        }
      });
    }
    if (m.kind === 'approver') {
      const bad = m.tried && !m.alias.trim();
      return Object.assign(base, {
        isApprover: true, alias: m.alias, aliasCls: 'field' + (bad ? ' is-error' : ''), aliasErr: bad,
        onAlias: e => this.setModal({ alias: e.target.value }),
        saveApprover: () => {
          const alias = m.alias.trim();
          if (!alias) { this.setModal({ tried: true }); return; }
          const id = this.state.view.id;
          this.setState({ modal: null, requests: this.state.requests.map(r => r.id === id ? Object.assign({}, r, { approver: alias, changed: (r.changed || []).concat([r.approver + ' → ' + alias]) }) : r) });
          this.flash('Approver changed to ' + alias + '. They have been emailed.');
        }
      });
    }
    if (m.kind === 'history') return Object.assign(base, { isHistory: true });
    return base;
  }

  viewVals() {
    const s = this.state;
    const empty = { banner: false, timeline: [], mine: [], history: [] };
    if (!s.view) return empty;
    const isReq = s.view.kind === 'req';
    const src = isReq ? s.requests.find(r => r.id === s.view.id) : s.access.find(a => a.id === s.view.id);
    if (!src) return empty;
    const type = src.type;
    const mine = s.access.filter(a => a.type === type).map(a => {
      const st = this.accessStatus(a), d = daysUntil(a.expires);
      return { name: a.name, cls: 'mya-r' + (st !== 'active' ? ' is-warn' : ''), meta: st === 'expired' ? 'Expired ' + fmtDate(a.expires) : st === 'expiring' ? 'Expires in ' + d + ' days' : a.role + ' · ' + fmtMonth(a.expires), open: () => this.openView('acc', a.id) };
    });
    const out = {
      banner: s.banner && isReq && src.id === s.lastId, closeBanner: () => this.setState({ banner: false }),
      home: () => this.go('home', { homeTab: 'access', dashType: type }),
      history: () => this.setState({ modal: { kind: 'history' } }),
      typeLabel: TYPE_LABEL[type], typeShort: TYPE_SHORT[type], mine: mine, approver: src.approver,
      justification: src.just || '—'
    };
    if (isReq) {
      const pend = src.status === 'pending', den = src.status === 'denied', ok = src.status === 'approved';
      const expected = nextBizDay(src.submitted);
      const hist = [{ title: 'Submitted by pabedesf', sub: fmtDT(src.submitted) }, { title: 'Manager notified (' + (src.changed && src.changed.length ? src.changed[0].split(' → ')[0] : src.approver) + ')', sub: fmtDT(src.submitted) }];
      (src.changed || []).forEach(c => hist.push({ title: 'Approver changed: ' + c, sub: 'Today' }));
      (src.nudges || []).forEach(n => hist.push({ title: 'Reminder sent to ' + n, sub: 'Today' }));
      if (den) hist.push({ title: 'Denied by ' + src.approver, sub: fmtDT(src.decided) });
      if (ok) hist.push({ title: 'Approved by ' + src.approver + ' · access granted', sub: fmtDT(src.decided) });
      Object.assign(out, {
        id: src.id, title: TYPE_LABEL[type] + ' — ' + src.name, cardTitle: 'Request #' + src.id,
        statusLabel: pend ? 'Pending manager approval' : den ? 'Denied' : 'Approved',
        statusCls: pend ? 'pill pill-amber' : den ? 'pill pill-salmon' : 'pill pill-green',
        k3: type === 'mispn' ? 'Authentication' : 'Access type', v3: type === 'mispn' ? (src.auth || '—') : 'View (Reader) · 12 months',
        k5: 'Submitted', v5: fmtDT(src.submitted),
        k6: pend ? 'Expected by' : 'Decided', v6: pend ? fmtDate(expected) : fmtDate(src.decided),
        k7: 'Duration', v7: '12 months',
        isPending: pend, isDenied: den, reason: src.reason || '', canRenew: false,
        canEdit: pend && type === 'mispn',
        edit: () => { this.go('form', { step: 3, maxStep: 3, form: seedForm(2), approvals: seedApprovals(true), reviewSec: 0 }); },
        nudge: () => { this.setState({ requests: s.requests.map(r => r.id === src.id ? Object.assign({}, r, { nudges: (r.nudges || []).concat([r.approver]) }) : r) }); this.flash('Reminder sent to ' + src.approver + '.'); },
        changeApprover: () => this.setState({ modal: { kind: 'approver', alias: '', tried: false } }),
        resubmit: () => { if (type !== 'mispn') { this.flash("Resubmitting this request type isn't available yet. Contact your PM for help."); return; } this.startForm(src.name); },
        timeline: [
          { title: 'Submitted', sub: fmtDT(src.submitted), cls: 'tl-i is-done', check: true },
          { title: 'Manager approval', sub: pend ? 'Waiting on ' + src.approver + ' · usually < 1 day' : den ? 'Denied by ' + src.approver + ' · ' + fmtDate(src.decided) : 'Approved by ' + src.approver + ' · ' + fmtDate(src.decided), cls: 'tl-i ' + (pend ? 'is-cur' : den ? 'is-bad' : 'is-done'), check: ok },
          { title: 'Access granted', sub: ok ? 'Granted ' + fmtDate(src.decided) : den ? 'Not granted' : 'The identity gets access automatically', cls: 'tl-i' + (ok ? ' is-done' : ''), check: ok }
        ],
        history: hist
      });
    } else {
      const st = this.accessStatus(src), d = daysUntil(src.expires);
      Object.assign(out, {
        id: src.id.toUpperCase(), title: TYPE_LABEL[type] + ' — ' + src.name, cardTitle: 'Access details',
        statusLabel: st === 'expired' ? 'Expired' : st === 'expiring' ? 'Expires in ' + d + ' days' : 'Active',
        statusCls: st === 'expired' ? 'pill pill-salmon' : st === 'expiring' ? 'pill pill-amber' : 'pill pill-blue',
        k3: 'Role', v3: src.role, k5: 'Granted', v5: fmtDate(src.granted), k6: st === 'expired' ? 'Expired' : 'Expires', v6: fmtDate(src.expires),
        k7: type === 'mispn' ? 'Authentication' : 'Duration', v7: type === 'mispn' ? (src.auth || '—') : '12 months',
        isPending: false, isDenied: false, canEdit: false, canRenew: false,
        renew: () => this.renew(src),
        timeline: [
          { title: 'Submitted', sub: fmtDate(src.granted), cls: 'tl-i is-done', check: true },
          { title: 'Manager approval', sub: 'Approved by ' + src.approver, cls: 'tl-i is-done', check: true },
          { title: st === 'expired' ? 'Access expired' : 'Access granted', sub: st === 'expired' ? 'Expired ' + fmtDate(src.expires) : 'Until ' + fmtDate(src.expires), cls: 'tl-i ' + (st === 'expired' ? 'is-bad' : 'is-done'), check: st !== 'expired' }
        ],
        history: [{ title: 'Access granted', sub: fmtDate(src.granted) }, { title: st === 'expired' ? 'Access expired' : 'Expires', sub: fmtDate(src.expires) }]
      });
    }
    return out;
  }

  reviewVals() {
    const s = this.state, f = s.form, sec = s.reviewSec;
    const apItems = s.approvals.map(a => ({ k: a.name, v: a.status === 'confirmed' ? 'On file · expires ' + fmtDate(a.expires) : a.status === 'uploaded' ? 'Uploaded ' + a.fileName + ' · expires ' + fmtDate(a.expires) : a.status === 'exempt' ? 'Exempt — ' + a.reason : a.status === 'expired' ? 'Expired ' + fmtDate(a.expires) + ' (needs renewal)' : 'Missing' }));
    const yn = b => b ? 'Yes' : 'No';
    const dash = v => (v && String(v).trim()) || '—';
    const detItems = [
      { k: 'Is Mala Org?', v: yn(f.mala) }, { k: 'User', v: dash(f.user) }, { k: 'FTE Manager Alias', v: dash(f.manager) },
      { k: 'Downstream System FTE Owner', v: dash(f.owner) }, { k: 'MI/SPN name', v: dash(f.identity) },
      { k: 'Service Tree ID', v: dash(f.serviceTreeId) }, { k: 'Team alias/DL', v: dash(f.teamAlias) },
      { k: 'Existing SPN Access?', v: dash(f.existingSpn) }, { k: 'Replace existing SPN with Managed Identity?', v: yn(f.replaceSpn) },
      { k: 'Tenant ID', v: dash(f.tenantId) }, { k: 'Tenant Type', v: dash(f.tenantType) }, { k: 'Type of Authentication', v: dash(f.authType) }
    ];
    const bjItems = BJQ.map(q => ({ k: q.label, v: dash(f[q.key]) })).concat([
      { k: 'Access / extract frequency', v: dash(f.freq) },
      { k: 'Subscribed to email notifications?', v: yn(f.emailSub) }, { k: 'Storage location', v: dash(f.storage) }, { k: 'Downstream users', v: dash(f.downstream) }
    ]);
    const lists = [apItems, detItems, bjItems];
    const labels = STEPS.slice(0, 3);
    return {
      jumps: labels.map((l, i) => ({ n: i + 1, label: l, go: () => this.goStep(i) })),
      secs: labels.map((l, i) => ({ n: i + 1, label: 'Show ' + l, on: i === sec, cls: 'mdot' + (i === sec ? ' is-on' : ''), hasLine: i < 2, pick: () => this.setState({ reviewSec: i }) })),
      secNum: sec + 1, secTitle: labels[sec], items: lists[sec],
      edit: () => this.goStep(sec),
      hasPrev: sec > 0, hasNext: sec < 2, prevLabel: labels[sec - 1] || '', nextLabel: labels[sec + 1] || '',
      prev: () => this.setState({ reviewSec: sec - 1 }), next: () => this.setState({ reviewSec: sec + 1 })
    };
  }

  renderVals() {
    const s = this.state, f = s.form, step = s.step;
    const oos = () => this.flash("This page isn't available yet.");
    const goHome = () => this.go('home', { homeTab: 'issue' });
    const goAccess = () => this.go('access');
    const goDashboard = () => this.go('home', { homeTab: 'access' });

    const titles = { access: 'Access Request Form', form: 'MI/SPN Request Form', success: 'MI/SPN Request Form', view: 'View Request' };
    const backs = { access: goHome, form: () => this.go('access'), success: goHome, view: () => this.go('home', { homeTab: 'access' }) };
    const hdr = {
      showLogo: s.screen === 'home', showBack: s.screen !== 'home', title: titles[s.screen] || '', back: backs[s.screen] || goHome,
      dashCls: 'navbtn' + ((s.screen === 'home' && s.homeTab === 'access') ? ' is-on' : '')
    };
    const tab = t => 'tab' + (s.homeTab === t ? ' is-on' : '');
    const home = {
      tabIssue: tab('issue'), tabCap: tab('capability'), tabAccess: tab('access'),
      isIssue: s.homeTab === 'issue', isCap: s.homeTab === 'capability', isAccess: s.homeTab === 'access',
      showTable: s.homeTab !== 'access',
      pickIssue: () => this.setState({ homeTab: 'issue' }), pickCap: () => this.setState({ homeTab: 'capability' }), pickAccess: () => this.setState({ homeTab: 'access' })
    };

    // form errors
    const curErrs = step < 3 ? this.stepErrors(step) : {};
    const nErr = Object.keys(curErrs).length;
    const de = s.showErr[1] ? this.detailErrors() : {};
    const be = s.showErr[2] ? this.bjErrors() : {};
    const allE = Object.assign({}, de, be);
    const keys = ['user', 'manager', 'owner', 'identity', 'serviceTreeId', 'teamAlias', 'existingSpn', 'tenantId', 'tenantType', 'authType', 'freq', 'storage', 'downstream'];
    const c = {}, has = {}, e = {}, h = {};
    keys.forEach(k => { has[k] = !!allE[k]; e[k] = allE[k] || ''; c[k] = 'field' + (allE[k] ? ' is-error' : ''); h[k] = ev => this.setField(k, ev.target.value); });
    const ic = { manager: 'input' };
    h.clearUser = () => this.setState({ form: Object.assign({}, f, { user: '', userLocked: false }) }, () => { const el = document.getElementById('f-user'); if (el) el.focus(); });
    h.clearManager = () => this.setField('manager', '');
    h.clearOwner = () => this.setField('owner', '');
    h.toggleMala = () => this.setField('mala', !f.mala);
    h.toggleRep = () => this.setField('replaceSpn', !f.replaceSpn);
    h.toggleEm = () => this.setField('emailSub', !f.emailSub);
    const sw = (on) => 'switch' + (on ? ' is-on' : '');
    const tg = {
      mala: sw(f.mala), malaNo: f.mala ? '' : 'on', malaYes: f.mala ? 'on' : '',
      rep: sw(f.replaceSpn), repNo: f.replaceSpn ? '' : 'on', repYes: f.replaceSpn ? 'on' : '',
      em: sw(f.emailSub), emNo: f.emailSub ? '' : 'on', emYes: f.emailSub ? 'on' : ''
    };
    const fv = Object.assign({}, f, { userOpen: !f.userLocked, hasManager: !!f.manager, hasOwner: !!f.owner });
    const dd = {};
    ['existingSpn', 'tenantType', 'authType', 'storage', 'downstream'].forEach(k => { dd[k] = this.ddVals(k, OPTS[k], f[k], PH); });
    const freqOpts = OPTS.freq.map(o => ({ label: o, on: f.freq === o, cls: 'choice' + (f.freq === o ? ' is-on' : ''), pick: () => this.setField('freq', o) }));

    const bj = {
      qs: BJQ.map(q => {
        const w = words(f[q.key]), open = !!s.bjOpen[q.key], err = be[q.key];
        return {
          id: 'bj-' + q.key, label: q.label, value: f[q.key], criteria: q.criteria, example: q.example, open: open,
          cls: 'field' + (err ? ' is-error' : ''), hasErr: !!err, err: err || '',
          wcText: w >= 50 ? w + ' words ✓' : w + ' / 50 word min', wcCls: 'wc' + (w >= 50 ? ' is-ok' : ''),
          caretCls: 'caret' + (open ? ' is-open' : ''),
          onChange: ev => this.setField(q.key, ev.target.value),
          toggle: () => this.setState({ bjOpen: Object.assign({}, s.bjOpen, { [q.key]: !open }) })
        };
      })
    };

    const steps = STEPS.map((label, i) => ({
      label: label, n: i + 1, done: i < step, showNum: i >= step, hasLine: i < 3,
      wrapCls: i === 3 ? 'stepw last' : 'stepw',
      cls: 'step ' + (i < step ? 'is-done' : i === step ? 'is-cur' : 'is-todo') + (i <= s.maxStep && i !== step ? ' is-link' : ''),
      lineCls: 'sline' + (i < step ? ' is-done' : ''),
      disabled: i > s.maxStep || i === step, aria: i === step ? 'step' : undefined,
      go: () => this.goStep(i)
    }));
    const form = {
      s0: step === 0, s1: step === 1, s2: step === 2, s3: step === 3,
      stepNum: step + 1, stepLabel: STEPS[step], guide: GUIDE[step],
      showErrBanner: !!s.showErr[step] && nErr > 0,
      errTitle: nErr + ' required field' + (nErr === 1 ? ' is' : 's are') + ' missing. ',
      back: () => this.back(), next: () => this.next(),
      nextLabel: step === 3 ? 'Submit' : 'Next', nextArrow: step < 3,
      showReturn: s.maxStep === 3 && step < 3,
      toReview: () => this.validateAnd(() => { this.setState({ step: 3, openDD: '' }); this.top(); })
    };

    const d = this.dashVals();
    const lastReq = s.requests.find(r => r.id === s.lastId);
    const succ = { id: s.lastId, name: lastReq ? lastReq.name : '', view: () => this.go('view', { view: { kind: 'req', id: s.lastId }, banner: true }) };

    return {
      scr: { home: s.screen === 'home', access: s.screen === 'access', form: s.screen === 'form', success: s.screen === 'success', view: s.screen === 'view' },
      hdr: hdr, home: home, d: d, oos: oos, goHome: goHome, goAccess: goAccess, goDashboard: goDashboard,
      startForm: () => this.startForm(''),
      steps: steps, form: form, ap: this.approvalVals(), f: fv, c: c, has: has, e: e, h: h, ic: ic, tg: tg, dd: dd, bj: bj,
      freqOpts: freqOpts, rv: this.reviewVals(), succ: succ, v: this.viewVals(), m: this.modalVals(),
      anyDD: !!s.openDD, closeDD: () => this.setState({ openDD: '' }),
      hasToast: !!s.toast, toast: s.toast
    };
  }
}

(function(){
  var m = /^#([a-z]+)$/.exec(location.hash || ''); if (m && ['access','approval','detail','bj','review','success','view','dashboard'].indexOf(m[1]) < 0) m = null;
  window.__app = mountDC(Component, document.getElementById('tpl'), document.getElementById('root'), { start: m ? m[1] : 'home' });
})();
</script>
</body>
</html>
